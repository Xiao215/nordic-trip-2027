<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>北欧之旅 2027</title>
<meta name="description" content="2027 年 7 月冰岛、挪威、瑞典、丹麦四周行程：每日路线、地图、预订、天气和行程助手。">
<meta name="theme-color" content="#1F4E6B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F4E6B'/%3E%3Cpath d='M4 23l7-10 4 5 5-9 8 14z' fill='%23EEF3F6'/%3E%3Ccircle cx='23' cy='8' r='2.5' fill='%23E7A33E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <main class="content">
    <!-- top bar: brand, the three views, currency and language -->
    <div class="sticky" id="sticky">
      <nav class="topbar" aria-label="主导航" data-i18n-aria-label="主导航">
        <a class="brand" href="#all" aria-label="北欧之旅 2027">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M4 23l7-10 4 5 5-9 8 14z"/><circle cx="23" cy="8" r="2.5"/></svg>
          <span id="brandName" data-i18n="北欧之旅">北欧之旅</span>
        </a>
        <div class="seg" role="tablist" aria-label="视图" data-i18n-aria-label="视图">
          <button role="tab" class="seg-btn" data-view="all" aria-selected="true"><span data-i18n="总览" data-i18n-sm="Trip">总览</span> <small id="allSub"></small></button>
          <button role="tab" class="seg-btn" data-view="day" aria-selected="false"><span data-i18n="每日" data-i18n-sm="Day">每日</span> <small id="daySub"></small></button>
          <button role="tab" class="seg-btn" data-view="prep" aria-selected="false"><span data-i18n="准备" data-i18n-sm="Prep">准备</span> <small id="prepCount"></small></button>
          <button role="tab" class="seg-btn" data-view="money" aria-selected="false"><span data-i18n="账本" data-i18n-sm="Money">账本</span> <small id="moneySub"></small></button>
        </div>
        <!-- phones: currency and language fold into this one button -->
        <button type="button" class="prefs-btn" id="prefsBtn" aria-expanded="false" aria-controls="prefs" aria-label="货币和语言" data-i18n-aria-label="货币和语言">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h7M15 6h1M4 14h1M9 14h7"/><circle cx="13" cy="6" r="2"/><circle cx="7" cy="14" r="2"/></svg><span id="prefsSym">kr</span>
        </button>
        <div class="prefs" id="prefs">
          <div class="cur" id="curBox">
            <button type="button" class="cur-btn" id="curBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="curMenu" title="价格换算" data-i18n-title="价格换算">
              <span class="cur-sym" id="curSym">kr</span><span id="curLabel">当地</span>
              <svg class="cur-chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 8l4 4 4-4"/></svg>
            </button>
            <div class="cur-menu" id="curMenu" role="listbox" aria-label="货币" data-i18n-aria-label="货币" tabindex="-1" hidden></div>
          </div>
          <div class="names" role="radiogroup" aria-label="语言 Language">
            <button type="button" role="radio" data-nm="zh" aria-checked="true" title="中文（地名悬停显示原文）">中文</button>
            <button type="button" role="radio" data-nm="local" aria-checked="false" title="English (place names in the local spelling)">EN</button>
          </div>
        </div>
      </nav>
      <div class="strip-wrap" id="stripWrap" hidden>
        <button type="button" class="strip-arrow" id="prevDay" aria-label="前一天" data-i18n-aria-label="前一天">‹</button>
        <div class="strip" id="strip" role="tablist" aria-label="选择日期" data-i18n-aria-label="选择日期"></div>
        <button type="button" class="strip-arrow" id="nextDay" aria-label="后一天" data-i18n-aria-label="后一天">›</button>
      </div>
    </div>

    <header class="top" id="top">
      <span class="eyebrow" id="eyebrow">Nordic Trip 2027</span>
      <h1 id="title">北欧之旅 2027</h1>
      <p class="lede" id="lede" data-i18n="正在载入行程…">正在载入行程…</p>
      <div class="chips" id="chips"></div>
    </header>

    <section id="allView" class="view">
      <div class="route" id="ribbon" aria-label="路线" data-i18n-aria-label="路线"></div>
      <div class="tl-head"><h2 data-i18n="四周日历">四周日历</h2><span class="hint" data-i18n="点任意一天看当天安排">点任意一天看当天安排</span></div>
      <div class="cal" id="cal"></div>
      <div class="tl-head"><h2 data-i18n="路线分段">路线分段</h2><span class="hint" id="legHint"></span></div>
      <div class="legs" id="legs"></div>
    </section>

    <section id="dayView" class="view" hidden>
      <div class="hero" id="hero" hidden></div>
      <div class="glance" id="glance"></div>
      <div class="tl-head">
        <h2 id="dayTitle"></h2>
        <span class="hint" data-i18n="点一站看详情，地图会跳过去">点一站看详情，地图会跳过去</span>
      </div>
      <p class="day-sub" id="daySubtitle"></p>
      <ol class="timeline" id="rows"></ol>
      <div class="draftbox" id="draftBox" hidden></div>
      <nav class="daynav" id="dayNav" aria-label="前一天 / 后一天"></nav>
    </section>

    <section id="prepView" class="view" hidden>
      <section class="entry" id="entry" aria-live="polite"></section>
      <div class="tl-head"><h2 data-i18n="预订">预订</h2><span class="hint" id="bookedCount"></span></div>
      <div class="bookings" id="bookings"></div>
      <div id="prepLists"></div>
      <footer class="foot">
        <p id="footnote"></p>
        <p id="sources"></p>
      </footer>
    </section>

    <section id="moneyView" class="view" hidden>
      <div class="tl-head"><h2 data-i18n="账本">账本</h2><span class="hint" id="moneyHint"></span></div>
      <div id="moneyGate"></div>
      <div id="moneySum"></div>
      <form class="mny-add" id="moneyAdd" autocomplete="off" hidden></form>
      <div id="moneyList"></div>
    </section>
  </main>

  <aside class="mapcol" aria-label="地图" data-i18n-aria-label="地图">
    <div class="stage">
      <div id="map" class="map" role="region" aria-label="行程地图" data-i18n-aria-label="行程地图"></div>
      <div class="map-tools" role="toolbar" aria-label="地图">
        <button class="tool" id="fitBtn" title="看全天 / 全程" data-i18n-title="看全天 / 全程">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg><span id="fitLabel">全程</span>
        </button>
        <a class="tool" id="dayRoute" href="https://www.google.com/maps" target="_blank" rel="noopener" title="在 Google 地图里打开当天路线" data-i18n-title="在 Google 地图里打开当天路线">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 4H4v12h12v-4M11 3h6v6M17 3l-8 8"/></svg><span data-i18n="导航">导航</span>
        </a>
      </div>
      <div class="map-caption" id="mapCaption"></div>
    </div>
  </aside>
</div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="照片" data-i18n-aria-label="照片" hidden>
  <button type="button" class="lb-x" id="lbClose" aria-label="关闭" data-i18n-aria-label="关闭">×</button>
  <button type="button" class="lb-nav prev" id="lbPrev" aria-label="上一张" data-i18n-aria-label="上一张">‹</button>
  <figure class="lb-fig"><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <button type="button" class="lb-nav next" id="lbNext" aria-label="下一张" data-i18n-aria-label="下一张">›</button>
</div>

<section class="cli" id="chat" data-open="false" aria-label="行程助手" data-i18n-aria-label="行程助手">
  <div class="cli-box">
    <header class="cli-head">
      <div class="cli-title"><b data-i18n="行程助手">行程助手</b><span class="cli-status" id="chatSub">连接中…</span></div>
      <button type="button" class="cli-btn" id="chatNew" title="清空对话，重新开始" data-i18n-title="清空对话，重新开始">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg><span data-i18n="新对话">新对话</span>
      </button>
      <button type="button" class="cli-btn icon" id="chatHide" aria-label="收起对话" data-i18n-aria-label="收起对话" title="收起（Esc）。收起后回答会继续。" data-i18n-title="收起（Esc）。收起后回答会继续。">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5"/></svg>
      </button>
    </header>
    <div class="cli-log" id="chatLog" aria-live="polite"></div>
    <form class="cli-join" id="chatJoin" hidden>
      <span data-i18n="输入访问码：">输入访问码：</span>
      <input id="joinCode" type="password" autocomplete="off" aria-label="访问码" data-i18n-aria-label="访问码" placeholder="访问码" data-i18n-placeholder="访问码">
      <button type="submit" data-i18n="确定">确定</button>
      <span class="cli-err" id="joinErr" role="alert"></span>
    </form>
    <form class="cli-input" id="chatForm">
      <svg class="cli-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h7A2.5 2.5 0 0 1 16 5.5v5a2.5 2.5 0 0 1-2.5 2.5H9l-4 3.5V13a2.5 2.5 0 0 1-1-2z"/></svg>
      <textarea id="chatText" rows="1" placeholder="问问行程助手…" data-i18n-placeholder="问问行程助手…" aria-label="问行程助手" data-i18n-aria-label="问行程助手" maxlength="2000"></textarea>
      <button type="button" class="cli-badge" id="chatBadge" hidden></button>
      <kbd class="cli-kbd" id="chatKbd">⌘K</kbd>
      <button type="submit" class="cli-send" id="chatSend" aria-label="发送" title="发送">
        <svg class="i-send" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V4M5 9l5-5 5 5"/></svg>
        <svg class="i-stop" viewBox="0 0 20 20" aria-hidden="true"><rect x="6" y="6" width="8" height="8" rx="1.5"/></svg>
      </button>
    </form>
    <div class="cli-foot" data-i18n="回车发送 · Shift+回车换行 · Esc 收起">回车发送 · Shift+回车换行 · Esc 收起</div>
  </div>
</section>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="chat.js"></script>
</body>
</html>
